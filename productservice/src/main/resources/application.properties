quarkus.http.host=0.0.0.0
quarkus.http.port=${QUARKUS_HTTP_PORT:8080}
quarkus.http.cors=true
quarkus.http.cors.origins=${CORS_ORIGINS:*}
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
quarkus.http.cors.access-control-allow-credentials=true
quarkus.resteasy-reactive.json.default-charset=UTF-8
quarkus.package.type=fast-jar

app.api-key=${APP_API_KEY:dev-local-key}

quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DATABASE_USERNAME:postgres}
quarkus.datasource.password=${DATABASE_PASSWORD:postgres}
quarkus.datasource.jdbc.url=${DATABASE_URL:jdbc:postgresql://localhost:5433/products_db}
quarkus.hibernate-orm.database.generation=${QUARKUS_HIBERNATE_ORM_DATABASE_GENERATION:update}
quarkus.hibernate-orm.jdbc.timezone=UTC
quarkus.hibernate-orm.log.sql=${QUARKUS_HIBERNATE_ORM_LOG_SQL:false}
quarkus.hibernate-orm.log.bind-parameters=${QUARKUS_HIBERNATE_ORM_LOG_BIND_PARAMETERS:false}

quarkus.log.level=INFO
quarkus.log.console.json=false
quarkus.log.category."com.product".level=INFO
quarkus.log.category."org.hibernate.SQL".level=DEBUG
quarkus.log.category."org.hibernate.orm.jdbc.bind".level=DEBUG
quarkus.log.category."io.smallrye.jwt".level=INFO
quarkus.log.category."io.smallrye.reactive.messaging.rabbitmq".level=DEBUG

#quarkus.security.auth.enabled=true

#mp.jwt.verify.audiences=quarkus-api
#mp.jwt.verify.issuer=auth-service

quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger
quarkus.swagger-ui.theme=flattop
quarkus.swagger-ui.display-request-duration=true
quarkus.swagger-ui.display-operation-id=true
quarkus.smallrye-openapi.path=/openapi

#quarkus.http.auth.permission.swagger.paths=/swagger/*
#quarkus.http.auth.permission.swagger.policy=permit

#quarkus.http.auth.permission.openapi.paths=/openapi
#quarkus.http.auth.permission.openapi.policy=permit

#quarkus.http.auth.permission.products.paths=/products/*
#quarkus.http.auth.permission.products.policy=authenticated


quarkus.micrometer.enabled=true
quarkus.micrometer.export.prometheus.enabled=true
quarkus.micrometer.binder.http-server.enabled=true
quarkus.micrometer.binder.jvm.enabled=true
quarkus.micrometer.export.prometheus.path=/q/metrics

quarkus.smallrye-health.root-path=/q
quarkus.smallrye-health.liveness-path=/health/live
quarkus.smallrye-health.readiness-path=/q/health/ready

rabbitmq-host=${RABBITMQ_HOST:rabbitmq}
rabbitmq-port=${RABBITMQ_PORT:5672}
rabbitmq-username=${RABBITMQ_USERNAME:guest}
rabbitmq-password=${RABBITMQ_PASSWORD:guest}
rabbitmq-ssl=${RABBITMQ_TLS:false}

mp.messaging.connector.smallrye-rabbitmq.host=${rabbitmq-host}
mp.messaging.connector.smallrye-rabbitmq.port=${rabbitmq-port}
mp.messaging.connector.smallrye-rabbitmq.username=${rabbitmq-username}
mp.messaging.connector.smallrye-rabbitmq.password=${rabbitmq-password}

mp.messaging.outgoing.product-events-out.connector=smallrye-rabbitmq
mp.messaging.outgoing.product-events-out.exchange.name=product-exchange
mp.messaging.outgoing.product-events-out.exchange.type=topic
mp.messaging.outgoing.product-events-out.routing-key=product.created
mp.messaging.outgoing.product-events-out.default-routing-key=product.created
mp.messaging.outgoing.product-events-out.exchange.declare=true


mp.messaging.incoming.product-events-in.connector=smallrye-rabbitmq
mp.messaging.incoming.product-events-in.queue.name=product-queue
mp.messaging.incoming.product-events-in.exchange.name=product-exchange
mp.messaging.incoming.product-events-in.exchange.type=topic
mp.messaging.incoming.product-events-in.routing-keys=product.created
mp.messaging.outgoing.product-events-out.exchange.declare=true

mp.messaging.outgoing.reservation-events-out.connector=smallrye-rabbitmq
mp.messaging.outgoing.reservation-events-out.exchange.name=reservation-exchange
mp.messaging.outgoing.reservation-events-out.exchange.type=topic
mp.messaging.outgoing.reservation-events-out.routing-key=reservation.created
mp.messaging.outgoing.reservation-events-out.default-routing-key=reservation.created
mp.messaging.outgoing.reservation-events-out.exchange.declare=true

mp.messaging.incoming.reservation-events-in.connector=smallrye-rabbitmq
mp.messaging.incoming.reservation-events-in.queue.name=reservation-queue
mp.messaging.incoming.reservation-events-in.exchange.name=reservation-exchange
mp.messaging.incoming.reservation-events-in.exchange.type=topic
mp.messaging.incoming.reservation-events-in.routing-keys=reservation.created

