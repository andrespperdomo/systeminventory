quarkus.oidc.auth-server-url=${QUARKUS_OIDC_AUTH_SERVER_URL:https://cognito-idp.us-east-1.amazonaws.com/us-east-1_1ThOU5x0E}
quarkus.oidc.application-type=service
quarkus.oidc.roles.role-claim-path=cognito:groups
