quarkus.kafka.devservices.enabled=false
quarkus.redis.hosts=${REDIS_HOST:redis://redis:6379}

quarkus.oidc.devservices.enabled=false

%dev.quarkus.log.level=DEBUG
%dev.quarkus.hibernate-orm.log.sql=true
%dev.quarkus.hibernate-orm.log.bind-parameters=true
%dev.rabbitmq-host=rabbitmq
%dev.quarkus.http.cors.origins=*
%dev.app.api-key=dev-local-key

%prod.quarkus.log.level=INFO
%prod.quarkus.swagger-ui.always-include=true
%prod.quarkus.hibernate-orm.log.sql=true
%prod.quarkus.hibernate-orm.log.bind-parameters=true
%prod.quarkus.http.cors.origins=${CORS_ORIGINS}


%test.quarkus.devservices.enabled=false
%test.quarkus.oidc.devservices.enabled=false
%test.quarkus.keycloak.devservices.enabled=false
%test.quarkus.oidc.enabled=false

%test.quarkus.rabbitmq.devservices.enabled=false
%test.rabbitmq-host=localhost
%test.rabbitmq-port=5672
%test.rabbitmq-username=guest
%test.rabbitmq-password=guest
%test.mp.messaging.incoming.product-events-in-test.connector=smallrye-rabbitmq
%test.mp.messaging.incoming.product-events-in-test.queue.name=product-queue
%test.mp.messaging.incoming.product-events-in-test.exchange.name=product-exchange
%test.mp.messaging.incoming.product-events-in-test.exchange.type=topic
%test.mp.messaging.incoming.product-events-in-test.routing-keys=product.created
%test.mp.messaging.outgoing.product-events-out-test.connector=smallrye-rabbitmq
%test.mp.messaging.outgoing.product-events-out-test.password=guest
%test.mp.messaging.outgoing.product-events-out-test.exchange.name=product-exchange
%test.mp.messaging.outgoing.product-events-out-test.exchange.type=topic
%test.mp.messaging.outgoing.product-events-out-test.default-routing-key=product.created
%test.mp.messaging.outgoing.reservation-events-out.exchange.declare=true
