services:
  nginx:
    image: nginx:stable-alpine3.23-perl
    container_name: ngnix
    ports:
      - "80:80"
    volumes:
      # Mount local html directory to NGINX static content directory
      - ./html:/usr/share/nginx/html:ro 
      # Mount local nginx.conf to override the default config file
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped
  db:
    image: postgres:15
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d
    ports:
      - "5433:5432"  
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    ports:
    - "5672:5672"
    - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest    
      

  redis:
    image: redis:6.2.6-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:  
      - redis-data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf
    environment:
      REDIS_PASSWORD: mypassword
      REDIS_DATABASES: 16
      REDIS_MAXMEMORY: 512mb
      REDIS_APPENDONLY: "yes" 

  nodejs:
    build: ./kafka-ws-project
    ports:
      - "3000:3000"
    volumes:
      - .:/kafka-ws-project
      - /kafka-ws-project/node_modules
    environment:
      - NODE_ENV=development
    command: npm start     
    
  authservice:
    build:
      context: ./authservice
    ports:
    - "8086:8080"
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://db:5432/auth_db
      QUARKUS_DATASOURCE_USERNAME: postgres
      QUARKUS_DATASOURCE_PASSWORD: postgres
      QUARKUS_REDIS_HOSTS: redis://redis:6379
##      QUARKUS_HTTP_HOST: 0.0.0.0
##      QUARKUS_HTTP_PORT: 8080

    # Kafka bootstrap (CRITICAL)
      MP_MESSAGING_CONNECTOR_SMALLRYE_KAFKA_BOOTSTRAP_SERVERS: kafka:9092

    # Outgoing channel
      MP_MESSAGING_OUTGOING_MY_OUT_CONNECTOR: smallrye-kafka
      MP_MESSAGING_OUTGOING_MY_OUT_TOPIC: user-topic

    # Incoming channel
      MP_MESSAGING_INCOMING_MY_IN_CONNECTOR: smallrye-kafka
      MP_MESSAGING_INCOMING_MY_IN_TOPIC: user-topic
    depends_on:
      - db
      - redis 
      - kafka    

  authencryptionservice:
    build:
      context: ./authencryptionservice
    ports:
    - "8087:8080"
    environment:
      QUARKUS_PROFILE: dev
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://db:5432/auth_db
      QUARKUS_DATASOURCE_USERNAME: postgres
      QUARKUS_DATASOURCE_PASSWORD: postgres
      QUARKUS_REDIS_HOSTS: redis://redis:6379

    # Kafka bootstrap (CRITICAL)
      MP_MESSAGING_CONNECTOR_SMALLRYE_KAFKA_BOOTSTRAP_SERVERS: kafka:9092

    # Outgoing channel
      MP_MESSAGING_OUTGOING_MY_CONNECTOR: smallrye-kafka
      MP_MESSAGING_OUTGOING_MY_TOPIC: user-topic

    # Incoming channel
#      MP_MESSAGING_INCOMING_MY_CONNECTOR: smallrye-kafka
#      MP_MESSAGING_INCOMING_MY_TOPIC: user-topic
    depends_on:
      - kafka 
      - db
      - redis 
         

  product-test:
    image: maven:3.9.9-eclipse-temurin-21
    container_name: product-test
    working_dir: /app
    volumes:
      - ./productservice:/app
      - maven-repo:/root/.m2
    tty: true
    stdin_open: true
    command: >
      mvn test
      -Dsurefire.useFile=false
      -Dstyle.color=always

  productservice:
    build:
      context: ./productservice
#    image: quarkus-backend
#    container_name: quarkus-backend
    ports:
      - "8083:8080"
    environment:
      QUARKUS_PROFILE: dev
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://db:5432/products_db
      QUARKUS_DATASOURCE_USERNAME: postgres
      QUARKUS_DATASOURCE_PASSWORD: postgres
      QUARKUS_OIDC_AUTH_SERVER_URL: https://cognito-idp.us-east-1.amazonaws.com/us-east-1_BpoALPN8q
      APP_API_KEY: mypassword
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    #  - redis
   #   - kafka
  #    - imageservice
   #   MP_MESSAGING_OUTGOING_MY_OUT_VALUE_SERIALIZER: io.quarkus.kafka.client.serialization.ObjectMapperSerializer
  inventoryservice:
    build:
      context: ./inventoryservice
#    image: quarkus-backend
#    container_name: quarkus-backend
    ports:
      - "8084:8080"
    environment:
      QUARKUS_PROFILE: dev
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://db:5432/inventory_db
      QUARKUS_DATASOURCE_USERNAME: postgres
      QUARKUS_DATASOURCE_PASSWORD: postgres
      INVENTORY_API_KEY: mypassword
    depends_on:
      - db
      - redis
      - rabbitmq

  iaservice:
    build:
      context: ./IAService
#    image: quarkus-backend
#    container_name: quarkus-backend
    ports:
      - "8085:8080"
    environment:
      QUARKUS_PROFILE: dev
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://db:5432/inventory_db
      QUARKUS_DATASOURCE_USERNAME: postgres
      QUARKUS_DATASOURCE_PASSWORD: postgres
      INVENTORY_API_KEY: mypassword
    depends_on:
      - db
      - redis
      - rabbitmq


#  frontend:
#    build: ./frontend
#    ports:
#      - "3000:80"
#    depends_on:
#      - backend

  prometheus:
    image: prom/prometheus
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana
    container_name: grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus    

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
    - zookeeper
    ports:
    - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

  localstack:
    image: localstack/localstack:latest
    container_name: localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=sns,sqs,dynamodb,s3,cloudwatch,iam,lambda
      - DEBUG=1
      - LAMBDA_EXECUTOR=docker
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"

  jenkins:
    image: jenkins/jenkins:lts
    container_name: jenkins
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
    restart: always    

volumes:
  redis-data:
  postgres_data:
  jenkins_home:
  image_data:
  maven-repo:


      


  
  
